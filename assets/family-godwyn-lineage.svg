<text x="1096" y="337" fill="#d8b879" text-anchor="middle" font-family="Georgia,serif" font-size="20">Aveline's brother · Atte's great-uncle</text>
<text x="1096" y="366" fill="#e9d4ac" text-anchor="middle" font-family="Georgia,serif" font-size="17">Last bearer of the Ancestral Sword</text>
