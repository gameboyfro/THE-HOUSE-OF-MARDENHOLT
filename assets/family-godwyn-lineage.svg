<text x="400" y="247" fill="#d8b879" text-anchor="middle" font-family="Georgia,serif" font-size="17" letter-spacing="3">MARRIED · HEARTHGLEN</text>
<text x="400" y="283" fill="#f7ebce" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="bold">Ser Edric Mardenholt</text>
