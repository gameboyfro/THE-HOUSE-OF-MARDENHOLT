<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc">
<title id="title">House Mardenholt family tree including the Godwyn bloodline</title>
<desc id="desc">Lady Aveline Godwyn, wife of Ser Edric Mardenholt, is the sister of Lieutenant Blake Godwyn, the Ancestral Sword's last bearer. Aveline and Edric's sons are Halric and Corvin; Halric and Maera have Atte, while Corvin and Elsbeth have Lucan and Elira.</desc>
<defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f4e4c3"/><stop offset="1" stop-color="#d5b88d"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#143a32"/><stop offset="1" stop-color="#0a2421"/></linearGradient><filter id="texture" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="11" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter></defs>
<rect width="1440" height="950" fill="url(#paper)"/>
<rect width="1440" height="950" filter="url(#texture)" fill="transparent"/>
<rect x="25" y="24" width="1390" height="898" rx="14" fill="none" stroke="#8d6831" stroke-width="5"/>
<rect x="42" y="42" width="1356" height="864" rx="8" fill="none" stroke="#ac8c52" stroke-width="1.7"/>
<g fill="#1d3e33" text-anchor="middle" font-family="Georgia,serif">
<text x="720" y="92" font-size="45" font-weight="bold">THE FAMILY OF THE GUARDIAN OAK</text>
<text x="720" y="128" font-size="20" letter-spacing="4">HOUSE MARDENHOLT • HOUSE GODWYN • LORDAERON</text>
</g>
